<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Icône byzantine du taureau ailé, symbole de l’Évangile de Luc">
  <title>Le Taureau — Évangile de Luc</title>
  <defs>
    <linearGradient id="l-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8e7b8"/><stop offset=".55" stop-color="#e7c87f"/><stop offset="1" stop-color="#cfa957"/>
    </linearGradient>
    <radialGradient id="l-glow" cx=".5" cy=".38" r=".72">
      <stop offset="0" stop-color="#fff8e2" stop-opacity=".95"/><stop offset="1" stop-color="#fff8e2" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="l-clip"><rect x="8" y="8" width="384" height="384"/></clipPath>
  </defs>
  <rect width="400" height="400" fill="#6f5220"/>
  <rect x="8" y="8" width="384" height="384" fill="url(#l-gold)"/>
  <g clip-path="url(#l-clip)" fill="#fff6dc" opacity=".18">
    <path d="M200 200 L196 -90 L204 -90 Z"/>
    <path d="M200 200 L196 -90 L204 -90 Z" transform="rotate(30 200 200)"/>
    <path d="M200 200 L196 -90 L204 -90 Z" transform="rotate(60 200 200)"/>
    <path d="M200 200 L196 -90 L204 -90 Z" transform="rotate(90 200 200)"/>
    <path d="M200 200 L196 -90 L204 -90 Z" transform="rotate(120 200 200)"/>
    <path d="M200 200 L196 -90 L204 -90 Z" transform="rotate(150 200 200)"/>
    <path d="M200 200 L196 -90 L204 -90 Z" transform="rotate(180 200 200)"/>
    <path d="M200 200 L196 -90 L204 -90 Z" transform="rotate(210 200 200)"/>
    <path d="M200 200 L196 -90 L204 -90 Z" transform="rotate(240 200 200)"/>
    <path d="M200 200 L196 -90 L204 -90 Z" transform="rotate(270 200 200)"/>
    <path d="M200 200 L196 -90 L204 -90 Z" transform="rotate(300 200 200)"/>
    <path d="M200 200 L196 -90 L204 -90 Z" transform="rotate(330 200 200)"/>
  </g>
  <rect x="8" y="8" width="384" height="384" fill="url(#l-glow)"/>
  <rect x="20" y="20" width="360" height="360" fill="none" stroke="#6f5220" stroke-width="2.5" opacity=".7"/>
  <g fill="#6f5220" opacity=".8">
    <rect x="29" y="29" width="14" height="14" transform="rotate(45 36 36)"/>
    <rect x="357" y="29" width="14" height="14" transform="rotate(45 364 36)"/>
    <rect x="29" y="357" width="14" height="14" transform="rotate(45 36 364)"/>
    <rect x="357" y="357" width="14" height="14" transform="rotate(45 364 364)"/>
  </g>

  <!-- Halo -->
  <circle cx="135" cy="205" r="90" fill="#fdf3d7" opacity=".92" stroke="#6f5220" stroke-width="3"/>

  <!-- Ombre au sol -->
  <ellipse cx="245" cy="320" rx="150" ry="12" fill="#6f5220" opacity=".35"/>

  <!-- Queue -->
  <path d="M334 238 C 356 262, 352 296, 342 310" fill="none" stroke="#1f3a5f" stroke-width="11" stroke-linecap="round"/>
  <ellipse cx="341" cy="315" rx="10" ry="14" fill="#1f3a5f"/>

  <!-- Corps -->
  <g fill="#1f3a5f">
    <ellipse cx="245" cy="250" rx="96" ry="50"/>
    <circle cx="315" cy="242" r="46"/>
    <circle cx="178" cy="254" r="44"/>
    <!-- Pattes arrière -->
    <circle cx="306" cy="268" r="28"/>
    <rect x="256" y="274" width="24" height="42" rx="6"/>
    <rect x="292" y="270" width="28" height="46" rx="6"/>
    <!-- Pattes avant -->
    <rect x="160" y="270" width="26" height="46" rx="6"/>
    <rect x="198" y="274" width="24" height="42" rx="6"/>
  </g>
  <!-- Sabots -->
  <g fill="#6f5220">
    <rect x="160" y="308" width="26" height="8" rx="3"/>
    <rect x="292" y="308" width="28" height="8" rx="3"/>
    <rect x="198" y="308" width="24" height="8" rx="3"/>
    <rect x="256" y="308" width="24" height="8" rx="3"/>
  </g>

  <!-- Cornes -->
  <path d="M150 192 C 180 168, 194 134, 178 106 C 172 98, 160 102, 158 112 C 166 138, 154 166, 138 184 Z" fill="#d9b86a" stroke="#6f5220" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M108 198 C 80 182, 62 146, 76 112 C 82 104, 94 107, 96 118 C 88 148, 98 174, 118 190 Z" fill="#f6e3b3" stroke="#6f5220" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Tête -->
  <ellipse cx="126" cy="218" rx="46" ry="39" fill="#1f3a5f"/>
  <!-- Oreille -->
  <ellipse cx="152" cy="214" rx="24" ry="14" fill="#1f3a5f" transform="rotate(-14 152 214)"/>
  <ellipse cx="156" cy="214" rx="13" ry="6" fill="#2b4a75" transform="rotate(-14 156 214)"/>
  <!-- Museau -->
  <ellipse cx="90" cy="240" rx="31" ry="23" fill="#2b4a75"/>
  <ellipse cx="79" cy="236" rx="6" ry="7" fill="#16283f"/>
  <ellipse cx="98" cy="240" rx="6" ry="7" fill="#16283f"/>
  <!-- Œil -->
  <ellipse cx="122" cy="206" rx="8" ry="5.5" fill="#f6e3b3"/>
  <circle cx="121" cy="206" r="2.8" fill="#16283f"/>
</svg>
